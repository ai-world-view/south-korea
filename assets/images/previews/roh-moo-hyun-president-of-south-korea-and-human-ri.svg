  <text x="100" y="340" font-family="Georgia, serif" font-size="22" fill="#d4b870" font-style="italic">President of South Korea</text>
  <text x="100" y="370" font-family="Georgia, serif" font-size="22" fill="#d4b870" font-style="italic">&amp; Human-Rights Advocate</text>

  
  <text x="100" y="415" font-family="Georgia, serif" font-size="16" fill="#b8a070" letter-spacing="2">1946 – 2009</text>

  
