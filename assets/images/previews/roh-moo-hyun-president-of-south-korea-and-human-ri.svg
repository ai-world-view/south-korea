  <text x="100" y="480" font-family="Georgia, serif" font-size="15" fill="#c8b880" opacity="0.85">16th President of the Republic of Korea</text>
  <text x="100" y="505" font-family="Georgia, serif" font-size="15" fill="#b8a870" opacity="0.7">February 25, 2003 – February 25, 2008</text>

  <text x="100" y="548" font-family="Georgia, serif" font-size="14" fill="#a89860" opacity="0.65" font-style="italic">Self-taught human-rights lawyer</text>
  <text x="100" y="568" font-family="Georgia, serif" font-size="14" fill="#a89860" opacity="0.65" font-style="italic">from South Gyeongsang Province</text>

  <text x="100" y="610" font-family="Georgia, serif" font-size="14" fill="#988050" opacity="0.6">Born: Kimhae (김해), September 1, 1946</text>
  <text x="100" y="630" font-family="Georgia, serif" font-size="14" fill="#988050" opacity="0.6">Died: May 23, 2009</text>

  
