<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>North Jeolla Province – Jeonbuk Special Self-Governing Province, South Korea</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c4c8" />
      <stop offset="100%" stop-color="#8fb0b8" />
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8c6e" />
      <stop offset="100%" stop-color="#5a6e52" />
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d4a0" />
      <stop offset="100%" stop-color="#b4c28c" />
    </linearGradient>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b09a70" stroke-width="0.5" opacity="0.4" />
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.8" fill="#8a7a5a" opacity="0.5" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#hatch)" opacity="0.3" />

  
  <rect x="24" y="24" width="1488" height="976" fill="none" stroke="#8a7050" stroke-width="3" />
  <rect x="32" y="32" width="1472" height="960" fill="none" stroke="#8a7050" stroke-width="1" />

  
  <path d="M0,0 L480,0 L440,200 L400,400 L380,600 L400,800 L420,1024 L0,1024 Z" fill="url(#sea)" opacity="0.85" />
  
