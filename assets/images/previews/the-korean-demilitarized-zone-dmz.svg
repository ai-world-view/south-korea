    <rect x="0" y="0" width="100" height="10" fill="#2a2a2a" />
    <rect x="100" y="0" width="100" height="10" fill="#e8dfc8" stroke="#2a2a2a" stroke-width="1" />
    <line x1="0" y1="-4" x2="0" y2="14" stroke="#2a2a2a" stroke-width="1.5" />
    <line x1="200" y1="-4" x2="200" y2="14" stroke="#2a2a2a" stroke-width="1.5" />
