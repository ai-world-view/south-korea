<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Korean Demilitarized Zone (DMZ) — Atlas Banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8cdd8" />
      <stop offset="100%" stop-color="#9ab8c8" />
    </linearGradient>
    <linearGradient id="northGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa888" />
      <stop offset="100%" stop-color="#7a9472" />
    </linearGradient>
    <linearGradient id="southGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b87a" />
      <stop offset="100%" stop-color="#b8a860" />
    </linearGradient>
    <filter id="engrave" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#5a4a2a" stroke-width="0.4" opacity="0.15" />
    </pattern>
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="8" height="8">
      <line x1="0" y1="0" x2="8" y2="8" stroke="#2a3a2a" stroke-width="0.5" opacity="0.12" />
      <line x1="8" y1="0" x2="0" y2="8" stroke="#2a3a2a" stroke-width="0.5" opacity="0.12" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  
  <rect x="0" y="0" width="480" height="1024" fill="url(#sea)" opacity="0.6" />
  <rect x="1100" y="0" width="436" height="1024" fill="url(#sea)" opacity="0.6" />

  
  <text x="200" y="500" font-family="Georgia, serif" font-size="22" fill="#4a6878" opacity="0.7" text-anchor="middle" font-style="italic" letter-spacing="4">YELLOW SEA</text>
  <text x="1340" y="480" font-family="Georgia, serif" font-size="20" fill="#4a6878" opacity="0.7" text-anchor="middle" font-style="italic" letter-spacing="3">SEA OF JAPAN</text>
  <text x="1340" y="510" font-family="Georgia, serif" font-size="16" fill="#4a6878" opacity="0.6" text-anchor="middle" font-style="italic" letter-spacing="2">(East Sea)</text>

  
  <path d="M480,120 L560,100 L640,90 L720,95 L800,88 L880,92 L960,100 L1040,110 L1100,130 L1100,220 L1090,300 L1080,380 L1060,450 L1050,490            L980,500 L900,496 L820,498 L740,500 L660,498 L580,495 L520,490 L480,480 L470,400 L462,320 L460,240 Z" fill="url(#northGrad)" stroke="#5a6a50" stroke-width="2" />
  <path d="M480,120 L560,100 L640,90 L720,95 L800,88 L880,92 L960,100 L1040,110 L1100,130 L1100,220 L1090,300 L1080,380 L1060,450 L1050,490            L980,500 L900,496 L820,498 L740,500 L660,498 L580,495 L520,490 L480,480 L470,400 L462,320 L460,240 Z" fill="url(#crosshatch)" />

  
  <path d="M480,480 L520,490 L580,495 L660,498 L740,500 L820,498 L900,496 L980,500 L1050,490 L1060,450            L1070,530 L1075,600 L1060,660 L1030,720 L990,770 L940,810 L880,840 L820,860 L760,868 L700,860 L640,840 L590,808 L550,768 L520,720 L500,670 L488,610 L480,550 Z" fill="url(#southGrad)" stroke="#7a6a30" stroke-width="2" />
