  <rect x="56" y="56" width="368" height="168" fill="none" stroke="#5a4a2a" stroke-width="1" rx="2" />

  <text x="240" y="100" font-family="Georgia, serif" font-size="13" fill="#5a4a2a" text-anchor="middle" letter-spacing="5" opacity="0.8">GEOGRAPHY</text>
  <line x1="70" y1="108" x2="410" y2="108" stroke="#5a4a2a" stroke-width="1" opacity="0.5" />

  <text x="240" y="148" font-family="Georgia, serif" font-size="30" fill="#1a0a00" text-anchor="middle" font-weight="bold" letter-spacing="1">THE KOREAN</text>
  <text x="240" y="186" font-family="Georgia, serif" font-size="30" fill="#1a0a00" text-anchor="middle" font-weight="bold" letter-spacing="1">DEMILITARIZED</text>
  <text x="240" y="218" font-family="Georgia, serif" font-size="42" fill="#cc2222" text-anchor="middle" font-weight="bold" letter-spacing="4">ZONE</text>

  
  <text x="240" y="960" font-family="Georgia, serif" font-size="13" fill="#5a4a2a" text-anchor="middle" letter-spacing="2" opacity="0.7">ESTABLISHED BY ARMISTICE · PANMUNJOM · JULY 27, 1953 · 248 km</text>

  
