  <text x="765" y="320" font-family="Georgia, serif" font-size="36" fill="#2a3a22" text-anchor="middle" font-weight="bold" letter-spacing="6" opacity="0.85">NORTH KOREA</text>
  <text x="765" y="362" font-family="Georgia, serif" font-size="18" fill="#2a3a22" text-anchor="middle" letter-spacing="3" opacity="0.7">(DPRK)</text>
  <text x="765" y="680" font-family="Georgia, serif" font-size="34" fill="#4a3a10" text-anchor="middle" font-weight="bold" letter-spacing="5" opacity="0.85">SOUTH KOREA</text>
  <text x="765" y="718" font-family="Georgia, serif" font-size="18" fill="#4a3a10" text-anchor="middle" letter-spacing="3" opacity="0.7">(ROK)</text>

  
  <line x1="770" y1="502" x2="770" y2="440" stroke="#4a5a40" stroke-width="1.5" />
  <rect x="660" y="400" width="220" height="38" fill="#e8dfc8" stroke="#4a5a40" stroke-width="1.5" rx="3" />
  <text x="770" y="424" font-family="Georgia, serif" font-size="18" fill="#1a2a12" text-anchor="middle" font-weight="bold" letter-spacing="2">DMZ  ·  4 km wide</text>

  
  <text x="1070" y="462" font-family="Georgia, serif" font-size="14" fill="#cc2222" text-anchor="start" font-style="italic">MDL</text>

  
  <text x="458" y="482" font-family="Georgia, serif" font-size="14" fill="#cc2222" text-anchor="end" font-style="italic">Panmunjom</text>
  <text x="458" y="498" font-family="Georgia, serif" font-size="12" fill="#8a2222" text-anchor="end" font-style="italic">1953</text>

  
  <line x1="200" y1="502" x2="478" y2="502" stroke="#8a7a5a" stroke-width="1" stroke-dasharray="6,4" opacity="0.6" />
  <text x="195" y="498" font-family="Georgia, serif" font-size="13" fill="#6a5a3a" text-anchor="end" font-style="italic">38°N</text>
  <line x1="1060" y1="470" x2="1200" y2="470" stroke="#8a7a5a" stroke-width="1" stroke-dasharray="6,4" opacity="0.6" />

  
