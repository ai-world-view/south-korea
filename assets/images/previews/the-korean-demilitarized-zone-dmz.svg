  <ellipse cx="720" cy="940" rx="22" ry="14" fill="#c8b87a" stroke="#7a6a30" stroke-width="1.5" />
  <ellipse cx="600" cy="900" rx="16" ry="10" fill="#c8b87a" stroke="#7a6a30" stroke-width="1.5" />

  
  
  <path d="M480,484 L520,486 L580,492 L660,494 L740,496 L820,494 L900,493 L980,497 L1050,488 L1060,450            L1060,470 L1050,510 L980,518 L900,516 L820,518 L740,520 L660,518 L580,515 L520,510 L480,506 Z" fill="#4a5a40" opacity="0.85" />
  
  <path d="M480,484 L520,486 L580,492 L660,494 L740,496 L820,494 L900,493 L980,497 L1050,488 L1060,450            L1060,470 L1050,510 L980,518 L900,516 L820,518 L740,520 L660,518 L580,515 L520,510 L480,506 Z" fill="url(#crosshatch)" />

  
  <path d="M480,495 L520,498 L580,503 L660,506 L740,508 L820,506 L900,504 L980,507 L1050,499 L1060,460" stroke="#cc2222" stroke-width="3" fill="none" stroke-dasharray="12,6" />

  
  <path d="M480,484 L520,486 L580,492 L660,494 L740,496 L820,494 L900,493 L980,497 L1055,487" stroke="#2a3a22" stroke-width="2.5" fill="none" />
