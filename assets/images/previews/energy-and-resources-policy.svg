<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Energy and Resources Policy — South Korea's energy strategy banner</title>

  <defs>
    
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="50%" stop-color="#dfd3b0" />
      <stop offset="100%" stop-color="#cfc3a0" />
    </linearGradient>

    
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2e1e" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#3a2e1e" stop-opacity="0.78" />
    </linearGradient>

    
    <pattern id="hatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#b8a882" stroke-width="0.4" opacity="0.5" />
    </pattern>

    
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8cdd8" />
      <stop offset="100%" stop-color="#9ab8c8" />
    </linearGradient>

    
    <linearGradient id="landFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ba94" />
      <stop offset="100%" stop-color="#b8a87a" />
    </linearGradient>

    
    <linearGradient id="koreaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6a3a" />
      <stop offset="100%" stop-color="#7a5a2e" />
    </linearGradient>

    
    <radialGradient id="atomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c040" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f0c040" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="nuclearGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8d080" />
      <stop offset="100%" stop-color="#c8a830" />
    </radialGradient>

    
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a6540" />
      <stop offset="100%" stop-color="#5a4820" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3a2e1e" flood-opacity="0.3" />
    </filter>

    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  
