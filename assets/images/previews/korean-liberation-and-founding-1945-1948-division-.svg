    <text x="0" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a4830">S</text>
    <text x="70" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a4830">E</text>
    <text x="-68" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a4830">W</text>
  </g>

  
  <rect x="20" y="20" width="1496" height="984" fill="none" stroke="#8a7040" stroke-width="3" />
  <rect x="30" y="30" width="1476" height="964" fill="none" stroke="#8a7040" stroke-width="1" />

  
  <g stroke="#8a7040" stroke-width="1.2" fill="none">
    <path d="M 20 20 L 80 20 M 20 20 L 20 80" />
    <path d="M 1516 20 L 1456 20 M 1516 20 L 1516 80" />
    <path d="M 20 1004 L 80 1004 M 20 1004 L 20 944" />
    <path d="M 1516 1004 L 1456 1004 M 1516 1004 L 1516 944" />
  </g>

  
  <text x="100" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#5a4820" letter-spacing="4" font-style="italic">ATLAS OF MODERN HISTORY</text>

  <text x="100" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#1e1208" letter-spacing="-1">Korean Liberation</text>
  <text x="100" y="385" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#1e1208" letter-spacing="-1">and Founding</text>

  
  <line x1="100" y1="415" x2="560" y2="415" stroke="#8a5030" stroke-width="3" />
  <line x1="100" y1="422" x2="560" y2="422" stroke="#8a5030" stroke-width="1" />

  <text x="100" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#3a2010" letter-spacing="1">1945 – 1948</text>

  <text x="100" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#4a3818" font-style="italic">Division and the Birth of Two Republics</text>

  
  <rect x="100" y="600" width="320" height="70" rx="4" fill="#c8b888" fill-opacity="0.6" stroke="#8a7040" stroke-width="1.2" />
  <text x="120" y="628" font-family="Georgia, serif" font-size="14" fill="#2a1a05" font-weight="bold">August 15, 1945</text>
  <text x="120" y="650" font-family="Georgia, serif" font-size="13" fill="#3a2a10">Liberation from Japanese Colonial Rule</text>

  <rect x="100" y="688" width="320" height="70" rx="4" fill="#c8b888" fill-opacity="0.6" stroke="#8a7040" stroke-width="1.2" />
  <text x="120" y="716" font-family="Georgia, serif" font-size="14" fill="#2a1a05" font-weight="bold">August 15, 1948</text>
  <text x="120" y="738" font-family="Georgia, serif" font-size="13" fill="#3a2a10">Republic of Korea Established</text>

  <rect x="100" y="776" width="320" height="70" rx="4" fill="#c8b888" fill-opacity="0.6" stroke="#8a7040" stroke-width="1.2" />
  <text x="120" y="804" font-family="Georgia, serif" font-size="14" fill="#2a1a05" font-weight="bold">September 9, 1948</text>
  <text x="120" y="826" font-family="Georgia, serif" font-size="13" fill="#3a2a10">DPRK Proclaimed in the North</text>

  
  
