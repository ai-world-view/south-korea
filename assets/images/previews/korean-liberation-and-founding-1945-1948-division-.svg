  <path d="M 650 310 Q 680 290 720 285 Q 760 282 800 290 Q 840 298 870 310 Q 895 325 900 345 Q 905 365 895 385 Q 880 400 860 408 Q 840 415 820 418 L 895 510 Q 902 522 905 535 Q 910 565 900 595 Q 885 635 860 665 Q 835 690 810 710 Q 790 728 780 745 Q 770 728 755 710 Q 730 688 705 665 Q 678 638 662 605 Q 648 572 645 545 Q 642 522 645 510 L 780 530 L 820 418 Q 730 415 700 408 Q 670 398 655 380 Q 642 360 645 340 Z" fill="none" stroke="#5a4820" stroke-width="2" />

  
  <line x1="630" y1="530" x2="920" y2="530" stroke="#2a1a05" stroke-width="3.5" stroke-dasharray="14,6" />
  
  <text x="935" y="536" font-family="Georgia, serif" font-size="18" fill="#2a1a05" font-style="italic">38°N</text>

  
