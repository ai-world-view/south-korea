  <text x="775" y="625" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3f1a05" font-weight="bold" letter-spacing="2">U.S. ZONE</text>

  
  <g transform="translate(1290, 420)">
    
    <circle cx="0" cy="0" r="78" fill="none" stroke="#7a6840" stroke-width="1.5" />
    <circle cx="0" cy="0" r="60" fill="#e8dfc8" fill-opacity="0.85" stroke="#7a6840" stroke-width="1" />
    
