<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Korean Liberation and Founding, 1945–1948 — Division and the Birth of Two Republics</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="northZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a9bb5" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#5b7f9e" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="southZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c47a4a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#a85f35" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8cdd8" />
      <stop offset="100%" stop-color="#9ab5c4" />
    </linearGradient>
    <filter id="parchment">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
    <pattern id="gridLines" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#b0a080" stroke-width="0.4" stroke-opacity="0.5" />
      <line x1="0" y1="0" x2="0" y2="60" stroke="#b0a080" stroke-width="0.4" stroke-opacity="0.5" />
    </pattern>
    <pattern id="hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="8" y2="0" stroke="#7a9bb5" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>
    <pattern id="hatchS" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="8" stroke="#c47a4a" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  
  <rect width="1536" height="1024" fill="url(#gridLines)" />
  
  <rect width="1536" height="1024" fill="#c8b888" opacity="0.12" filter="url(#parchment)" />

  
  <ellipse cx="780" cy="512" rx="520" ry="440" fill="url(#seaGrad)" opacity="0.55" />

  
  
