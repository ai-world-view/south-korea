  <text x="220" y="510" font-family="Georgia, serif" font-size="21" fill="#3a2808">December 22, 1964 · Andong</text>

  <text x="120" y="550" font-family="Georgia, serif" font-size="21" fill="#3a2808" font-weight="bold">Party:</text>
  <text x="220" y="550" font-family="Georgia, serif" font-size="21" fill="#3a2808">Democratic Party</text>

  <text x="120" y="590" font-family="Georgia, serif" font-size="21" fill="#3a2808" font-weight="bold">Elected:</text>
  <text x="235" y="590" font-family="Georgia, serif" font-size="21" fill="#3a2808">June 3, 2025</text>

  <text x="120" y="630" font-family="Georgia, serif" font-size="21" fill="#3a2808" font-weight="bold">In office:</text>
  <text x="240" y="630" font-family="Georgia, serif" font-size="21" fill="#3a2808">June 4, 2025 –</text>

  
  <line x1="100" y1="658" x2="600" y2="658" stroke="#7a6035" stroke-width="1" />

  
  <text x="120" y="700" font-family="Georgia, serif" font-size="19" fill="#4a3820" font-style="italic">Won snap election following the</text>
  <text x="120" y="726" font-family="Georgia, serif" font-size="19" fill="#4a3820" font-style="italic">December 2024 constitutional crisis</text>
  <text x="120" y="752" font-family="Georgia, serif" font-size="19" fill="#4a3820" font-style="italic">and removal of President Yoon Suk-yeol.</text>

  <text x="120" y="800" font-family="Georgia, serif" font-size="18" fill="#4a3820">Former Governor of Gyeonggi Province</text>
  <text x="120" y="826" font-family="Georgia, serif" font-size="18" fill="#4a3820">and progressive "livelihood" advocate.</text>

  
