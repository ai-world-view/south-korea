  <rect x="24" y="24" width="1488" height="976" fill="none" stroke="#8a7a50" stroke-width="3" rx="4" />
  <rect x="36" y="36" width="1464" height="952" fill="none" stroke="#8a7a50" stroke-width="1" rx="2" />

  
  <rect x="60" y="60" width="580" height="400" rx="6" fill="#3a2e18" fill-opacity="0.82" />

  
  <text x="110" y="160" font-family="Georgia,serif" font-size="58" font-weight="bold" fill="#f0e8cc" letter-spacing="1">Sports and the</text>
  <text x="110" y="228" font-family="Georgia,serif" font-size="58" font-weight="bold" fill="#f0e8cc" letter-spacing="1">Olympic Games</text>

  
  <text x="110" y="290" font-family="Georgia,serif" font-size="22" fill="#d4c8a0" letter-spacing="2">SOUTH KOREA'S ATHLETIC LEGACY</text>

  
  <line x1="110" y1="312" x2="580" y2="312" stroke="#c0a840" stroke-width="2" />

  
