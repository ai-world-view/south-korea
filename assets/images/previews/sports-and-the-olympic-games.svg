    <path d="M760,370 L790,360 L810,390 L820,430 L800,470 L780,500 L760,510 L740,490 L730,460 L740,420 Z" />
    
    <path d="M840,320 L870,310 L890,340 L880,370 L860,380 L840,360 Z" />
    <path d="M860,380 L885,370 L900,400 L890,430 L870,440 L855,415 Z" />
    
    <path d="M680,420 L720,400 L750,440 L730,490 L700,510 L670,480 L660,450 Z" />
