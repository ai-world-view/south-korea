<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>The Three Kingdoms Period of Korea — Cartographic Banner</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8cdd8" />
      <stop offset="100%" stop-color="#9ab8c8" />
    </linearGradient>
    <linearGradient id="goguryeo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b4a3c" />
      <stop offset="100%" stop-color="#6b3228" />
    </linearGradient>
    <linearGradient id="baekje-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6b4a" />
      <stop offset="100%" stop-color="#345234" />
    </linearGradient>
    <linearGradient id="silla-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a5c8b" />
      <stop offset="100%" stop-color="#2e3f6b" />
    </linearGradient>
    <filter id="parchment" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended" />
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c4b090" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  
