  <text x="132" y="172" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="none" stroke="#8b1a1a" stroke-width="0.5" letter-spacing="-1" opacity="0.3">Lee Jae-yong</text>

  
  <text x="132" y="222" font-family="serif" font-size="32" fill="#8b1a1a" opacity="0.9">이재용</text>

  
