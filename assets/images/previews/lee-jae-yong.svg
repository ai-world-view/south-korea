<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Lee Jae-yong — Chairman of Samsung Electronics, South Korea</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8cdd6" />
      <stop offset="100%" stop-color="#9ab5c2" />
    </linearGradient>
    <linearGradient id="landgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b98a" />
      <stop offset="100%" stop-color="#b8a870" />
    </linearGradient>
    <filter id="engrave">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9a8a60" stroke-width="0.4" opacity="0.4" />
    </pattern>
    <pattern id="latlon" width="80" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="80" y2="30" stroke="#8a7a55" stroke-width="0.3" opacity="0.35" />
      <line x1="40" y1="0" x2="40" y2="60" stroke="#8a7a55" stroke-width="0.3" opacity="0.35" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#latlon)" />

  
  <rect x="80" y="80" width="1376" height="864" rx="4" fill="url(#ocean)" opacity="0.7" />
  <rect x="80" y="80" width="1376" height="864" rx="4" fill="url(#grid)" opacity="0.5" />

  
  <rect x="80" y="80" width="1376" height="864" rx="4" fill="none" stroke="#7a6a40" stroke-width="3" />
  <rect x="90" y="90" width="1356" height="844" rx="2" fill="none" stroke="#7a6a40" stroke-width="1" opacity="0.5" />

  
  
  <path d="M 400,180 L 560,160 L 700,170 L 820,200 L 900,240 L 940,300 L 960,380 L 920,440 L 880,480 L 820,500 L 760,520 L 700,510 L 640,490 L 580,460 L 520,420 L 460,380 L 420,340 L 380,290 L 370,240 Z" fill="url(#landgrad)" stroke="#8a7a50" stroke-width="1.5" />

  
  <path d="M 880,340 L 920,330 L 950,350 L 960,390 L 950,430 L 930,470 L 910,510 L 890,540 L 870,560 L 855,545 L 850,510 L 860,470 L 865,430 L 860,390 L 855,360 Z" fill="#c4956a" stroke="#8a7a50" stroke-width="1.5" />

  
