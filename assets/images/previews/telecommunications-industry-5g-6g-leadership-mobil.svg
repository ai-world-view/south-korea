    <text x="72" y="514">· KT Corporation (est. 1981)</text>
    <text x="72" y="534">· LG U+ (est. 1996)</text>
  </g>

  <line x1="60" y1="552" x2="400" y2="552" stroke="#8a7d58" stroke-width="0.6" />

  <text x="60" y="578" font-family="Georgia, serif" font-size="15" fill="#2a1f0a" font-weight="bold">Key Milestones</text>
  <g font-family="Georgia, serif" font-size="13" fill="#4a3820">
    <text x="72" y="600">· World's first consumer 5G network</text>
    <text x="96" y="618">April 3, 2019</text>
    <text x="72" y="642">· 6G commercialization target: 2030</text>
    <text x="72" y="664">· Mobile penetration &gt;90% of adults</text>
    <text x="72" y="686">· Government-backed R&amp;D programs</text>
  </g>

  <line x1="60" y1="705" x2="400" y2="705" stroke="#8a7d58" stroke-width="0.6" />

  
  <text x="60" y="735" font-family="Georgia, serif" font-size="13" fill="#5a4a2a">South Korea's three-carrier telecom</text>
  <text x="60" y="753" font-family="Georgia, serif" font-size="13" fill="#5a4a2a">ecosystem drives global mobile and</text>
  <text x="60" y="771" font-family="Georgia, serif" font-size="13" fill="#5a4a2a">broadband standards, integrating</text>
  <text x="60" y="789" font-family="Georgia, serif" font-size="13" fill="#5a4a2a">semiconductors, displays &amp; networks.</text>

  
