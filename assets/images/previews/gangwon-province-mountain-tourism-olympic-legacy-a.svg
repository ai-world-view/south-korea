<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Gangwon Province — Mountain Tourism, Olympic Legacy, and the DMZ Frontier</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8bfa0" />
      <stop offset="100%" stop-color="#e8dfc0" />
    </linearGradient>
    <linearGradient id="mtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8c6e" />
      <stop offset="100%" stop-color="#5a6e4e" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ece0" />
      <stop offset="60%" stop-color="#d8d0b8" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ab5c8" />
      <stop offset="100%" stop-color="#7a9eb5" />
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7a5a" stroke-width="0.5" opacity="0.3" />
    </pattern>
    <filter id="engrave">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended" />
      <feComposite in="blended" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>

  
