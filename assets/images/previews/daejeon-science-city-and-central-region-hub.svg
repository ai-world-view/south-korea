<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Daejeon — science city and central region hub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8cdd8" />
      <stop offset="100%" stop-color="#9db8c8" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b98a" />
      <stop offset="100%" stop-color="#b8a870" />
    </linearGradient>
    <filter id="engrave">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended" />
      <feComposite in="blended" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a09070" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <pattern id="crosshatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#7a9aaa" stroke-width="0.5" opacity="0.25" />
      <line x1="10" y1="0" x2="0" y2="10" stroke="#7a9aaa" stroke-width="0.5" opacity="0.25" />
    </pattern>
    <radialGradient id="glowDaejeon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c04030" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c04030" stop-opacity="0" />
    </radialGradient>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  
  <rect width="1536" height="1024" fill="url(#hatch)" />

  
