    <linearGradient id="korea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#96281b" />
    </linearGradient>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
