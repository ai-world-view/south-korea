    <text x="0" y="-4" font-family="Georgia, serif" font-size="14" fill="#4a3a10">0</text>
    <text x="115" y="-4" font-family="Georgia, serif" font-size="14" fill="#4a3a10" text-anchor="middle">250</text>
    <text x="240" y="-4" font-family="Georgia, serif" font-size="14" fill="#4a3a10">500 km</text>
  </g>

  
  <rect x="40" y="40" width="820" height="944" fill="#e4d8b8" opacity="0.55" />
  <rect x="40" y="40" width="820" height="944" fill="url(#crosshatch)" />

  
  <line x1="70" y1="80" x2="830" y2="80" stroke="#7a6a40" stroke-width="1.5" />
  <line x1="70" y1="88" x2="830" y2="88" stroke="#7a6a40" stroke-width="0.5" />

  
  <text x="70" y="86" font-family="Georgia, serif" font-size="22" fill="#7a6a40">✦</text>
  <text x="804" y="86" font-family="Georgia, serif" font-size="22" fill="#7a6a40">✦</text>

  
  <text x="450" y="130" font-family="Georgia, serif" font-size="22" fill="#7a6a40" text-anchor="middle" letter-spacing="6" font-style="italic">ATLAS OF MODERN KOREA</text>

  
  <text x="450" y="230" font-family="Georgia, serif" font-size="88" fill="#2a1e08" text-anchor="middle" font-weight="bold" letter-spacing="-1">Moon Jae-in</text>
  <text x="450" y="278" font-family="Georgia, serif" font-size="32" fill="#4a3a10" text-anchor="middle" letter-spacing="2">문재인</text>

  
  <line x1="150" y1="306" x2="750" y2="306" stroke="#8a6a30" stroke-width="1.5" />
  <circle cx="450" cy="306" r="5" fill="#8a6a30" />

  
  <text x="450" y="358" font-family="Georgia, serif" font-size="30" fill="#5a2010" text-anchor="middle" letter-spacing="3">10TH PRESIDENT OF SOUTH KOREA</text>
  <text x="450" y="398" font-family="Georgia, serif" font-size="22" fill="#6a5a30" text-anchor="middle">May 2017 – May 2022</text>

  
  <line x1="200" y1="424" x2="700" y2="424" stroke="#8a6a30" stroke-width="0.8" />

  
  <text x="120" y="476" font-family="Georgia, serif" font-size="19" fill="#3a2a08" font-weight="bold">Born:</text>
  <text x="230" y="476" font-family="Georgia, serif" font-size="19" fill="#3a2a08">January 24, 1953 · Geoje, South Gyeongsang</text>

  <text x="120" y="514" font-family="Georgia, serif" font-size="19" fill="#3a2a08" font-weight="bold">Party:</text>
  <text x="230" y="514" font-family="Georgia, serif" font-size="19" fill="#3a2a08">Democratic Party of Korea</text>

  <text x="120" y="552" font-family="Georgia, serif" font-size="19" fill="#3a2a08" font-weight="bold">Career:</text>
  <text x="230" y="552" font-family="Georgia, serif" font-size="19" fill="#3a2a08">Human-rights lawyer · Politician</text>

  <text x="120" y="590" font-family="Georgia, serif" font-size="19" fill="#3a2a08" font-weight="bold">Education:</text>
  <text x="260" y="590" font-family="Georgia, serif" font-size="19" fill="#3a2a08">Kyung Hee University School of Law</text>

  
  <line x1="120" y1="616" x2="780" y2="616" stroke="#8a6a30" stroke-width="0.8" />

  
  <text x="450" y="656" font-family="Georgia, serif" font-size="20" fill="#5a2010" text-anchor="middle" letter-spacing="4" font-style="italic">KEY EVENTS OF HIS PRESIDENCY</text>

  
  <circle cx="130" cy="700" r="5" fill="#8a2020" />
  <text x="148" y="704" font-family="Georgia, serif" font-size="18" fill="#3a2a08"><tspan font-weight="bold">2018</tspan> — PyeongChang Winter Olympics</text>

  <circle cx="130" cy="736" r="5" fill="#8a2020" />
  <text x="148" y="740" font-family="Georgia, serif" font-size="18" fill="#3a2a08"><tspan font-weight="bold">2018</tspan> — Three inter-Korean summits with Kim Jong-un</text>

  <circle cx="130" cy="772" r="5" fill="#8a2020" />
  <text x="148" y="776" font-family="Georgia, serif" font-size="18" fill="#3a2a08"><tspan font-weight="bold">2017</tspan> — Elected with 41.1% following Park impeachment</text>

  <circle cx="130" cy="808" r="5" fill="#8a2020" />
  <text x="148" y="812" font-family="Georgia, serif" font-size="18" fill="#3a2a08"><tspan font-weight="bold">2020</tspan> — Led South Korea through COVID-19 pandemic</text>

  
  <line x1="70" y1="900" x2="830" y2="900" stroke="#7a6a40" stroke-width="0.5" />
  <line x1="70" y1="908" x2="830" y2="908" stroke="#7a6a40" stroke-width="1.5" />

  
  <text x="450" y="942" font-family="Georgia, serif" font-size="16" fill="#7a6a40" text-anchor="middle" font-style="italic" letter-spacing="2">Sunshine Policy Revival · Korean Peninsula Diplomacy · Democratic Republic</text>

  
  <g opacity="0.18" stroke="#4a6070" stroke-width="0.8">
    
    <line x1="860" y1="200" x2="1510" y2="200" />
    <line x1="860" y1="350" x2="1510" y2="350" />
