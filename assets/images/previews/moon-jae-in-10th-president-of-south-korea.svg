<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Moon Jae-in — 10th President of South Korea</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8ccd8" />
      <stop offset="100%" stop-color="#9ab5c4" />
    </linearGradient>
    <linearGradient id="landgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8b98a" />
      <stop offset="100%" stop-color="#b8a870" />
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a09060" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <pattern id="crosshatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="0" stroke="#8a7a50" stroke-width="0.3" opacity="0.25" />
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8a7a50" stroke-width="0.3" opacity="0.25" />
    </pattern>
    <filter id="parchment">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="1" />
      </feComponentTransfer>
    </filter>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#bg)" />
  <rect width="1536" height="1024" fill="url(#hatch)" />

  
  <rect x="18" y="18" width="1500" height="988" fill="none" stroke="#7a6a40" stroke-width="3" />
  <rect x="26" y="26" width="1484" height="972" fill="none" stroke="#7a6a40" stroke-width="1" />

  
  <rect x="30" y="30" width="1476" height="964" fill="url(#sea)" opacity="0.4" />

  
  
  
  <g transform="translate(900, 200)">
    
    <path d="M 60,0 L 180,10 L 220,40 L 240,80 L 230,130 L 200,160 L 160,170 L 120,165 L 80,160 L 40,140 L 20,110 L 10,70 L 20,30 Z" fill="#b8a870" stroke="#7a6a40" stroke-width="2.5" />
    <path d="M 60,0 L 180,10 L 220,40 L 240,80 L 230,130 L 200,160 L 160,170 L 120,165 L 80,160 L 40,140 L 20,110 L 10,70 L 20,30 Z" fill="url(#crosshatch)" />

    
    <line x1="20" y1="160" x2="220" y2="165" stroke="#8a2020" stroke-width="2.5" stroke-dasharray="8,4" />

    
    <path d="M 20,165 L 80,162 L 120,167 L 160,172 L 200,162 L 220,167 L 235,200 L 230,240 L 210,280 L 180,320 L 150,360 L 130,400 L 120,440 L 115,460 L 100,450 L 80,410 L 60,370 L 40,320 L 20,270 L 10,220 L 12,185 Z" fill="#c8b060" stroke="#7a6a40" stroke-width="2.5" />
    <path d="M 20,165 L 80,162 L 120,167 L 160,172 L 200,162 L 220,167 L 235,200 L 230,240 L 210,280 L 180,320 L 150,360 L 130,400 L 120,440 L 115,460 L 100,450 L 80,410 L 60,370 L 40,320 L 20,270 L 10,220 L 12,185 Z" fill="url(#hatch)" opacity="0.5" />

    
    <ellipse cx="160" cy="510" rx="22" ry="14" fill="#c8b060" stroke="#7a6a40" stroke-width="1.5" />
    <ellipse cx="160" cy="510" rx="22" ry="14" fill="url(#hatch)" opacity="0.5" />
    <text x="160" y="536" font-family="Georgia, serif" font-size="18" fill="#4a3a10" text-anchor="middle" font-style="italic">Geoje</text>

    
    <circle cx="110" cy="240" r="9" fill="#8a2020" stroke="#5a1010" stroke-width="1.5" />
    <text x="128" y="237" font-family="Georgia, serif" font-size="20" fill="#3a2a08" font-weight="bold">Seoul</text>

    
    <circle cx="90" cy="80" r="7" fill="#555" stroke="#333" stroke-width="1.2" />
    <text x="108" y="78" font-family="Georgia, serif" font-size="18" fill="#3a3a3a">Pyongyang</text>

    
    <text x="120" y="110" font-family="Georgia, serif" font-size="22" fill="#4a3a10" text-anchor="middle" opacity="0.6" font-style="italic">North Korea</text>

    
    <text x="120" y="290" font-family="Georgia, serif" font-size="22" fill="#4a3a10" text-anchor="middle" opacity="0.7" font-style="italic">South Korea</text>

    
    <text x="120" y="560" font-family="Georgia, serif" font-size="18" fill="#4a6070" text-anchor="middle" font-style="italic" opacity="0.8">Korea Strait</text>

    
    <text x="320" y="300" font-family="Georgia, serif" font-size="20" fill="#4a6070" text-anchor="middle" font-style="italic" opacity="0.7">Sea of Japan</text>

    
    <text x="-120" y="320" font-family="Georgia, serif" font-size="20" fill="#4a6070" text-anchor="middle" font-style="italic" opacity="0.7">Yellow Sea</text>

    
    <path d="M 340,180 L 360,160 L 370,200 L 360,240 L 345,250 L 335,220 Z" fill="#c8b870" stroke="#7a6a40" stroke-width="1.5" opacity="0.8" />
    <path d="M 355,280 L 380,260 L 395,300 L 385,360 L 365,380 L 345,340 L 340,300 Z" fill="#c8b870" stroke="#7a6a40" stroke-width="1.5" opacity="0.8" />
    <text x="390" y="330" font-family="Georgia, serif" font-size="19" fill="#4a3a10" font-style="italic" opacity="0.7">Japan</text>

    
    <path d="M -200,0 L -80,-30 L 0,0 L 20,30 L 10,70 L 20,30 L 60,0" fill="none" stroke="#7a6a40" stroke-width="1.5" opacity="0.5" />

    
    <text x="130" y="155" font-family="Georgia, serif" font-size="16" fill="#8a2020" text-anchor="middle" font-style="italic">— DMZ —</text>
  </g>

  
  <g transform="translate(1400, 820)">
    <circle cx="0" cy="0" r="55" fill="#e8dfc8" stroke="#7a6a40" stroke-width="1.5" opacity="0.9" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#7a6a40" stroke-width="1" />
    
    <polygon points="0,-44 -7,-18 7,-18" fill="#8a2020" />
    
    <polygon points="0,44 -7,18 7,18" fill="#7a6a40" />
    
    <polygon points="44,0 18,-7 18,7" fill="#7a6a40" />
    
    <polygon points="-44,0 -18,-7 -18,7" fill="#7a6a40" />
    
    <circle cx="0" cy="0" r="4" fill="#7a6a40" />
    
    <text x="0" y="-50" font-family="Georgia, serif" font-size="18" fill="#8a2020" text-anchor="middle" font-weight="bold">N</text>
    <text x="0" y="62" font-family="Georgia, serif" font-size="16" fill="#7a6a40" text-anchor="middle">S</text>
    <text x="58" y="5" font-family="Georgia, serif" font-size="16" fill="#7a6a40" text-anchor="middle">E</text>
    <text x="-58" y="5" font-family="Georgia, serif" font-size="16" fill="#7a6a40" text-anchor="middle">W</text>
  </g>

  
  <g transform="translate(1050, 870)">
    <rect x="0" y="0" width="120" height="8" fill="#7a6a40" />
