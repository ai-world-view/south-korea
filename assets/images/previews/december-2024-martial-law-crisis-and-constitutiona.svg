  <text x="70" y="430" font-family="Georgia, serif" font-size="17" fill="#c8b888" opacity="0.9">South Korea's most severe political</text>
  <text x="70" y="455" font-family="Georgia, serif" font-size="17" fill="#c8b888" opacity="0.9">upheaval since the 1987 democratic</text>
  <text x="70" y="480" font-family="Georgia, serif" font-size="17" fill="#c8b888" opacity="0.9">transition. Emergency martial law</text>
  <text x="70" y="505" font-family="Georgia, serif" font-size="17" fill="#c8b888" opacity="0.9">declared 3 December 2024 — rescinded</text>
  <text x="70" y="530" font-family="Georgia, serif" font-size="17" fill="#c8b888" opacity="0.9">within six hours by National Assembly.</text>

