  <text x="84" y="698" font-family="Georgia, serif" font-size="15" fill="#c8b888" opacity="0.85">Yoon Removed from Office — Apr 2025</text>

  <rect x="70" y="715" width="4" height="4" fill="#c0392b" />
  <text x="84" y="723" font-family="Georgia, serif" font-size="15" fill="#c8b888" opacity="0.85">Arrested on Insurrection Charges</text>

