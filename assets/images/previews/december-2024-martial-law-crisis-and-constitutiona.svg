<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>December 2024 Martial Law Crisis and Constitutional Crisis – South Korea</title>

  <defs>
    
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcc8" />
      <stop offset="50%" stop-color="#ddd0b0" />
      <stop offset="100%" stop-color="#c9bb98" />
    </linearGradient>
    
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8faabf" />
      <stop offset="100%" stop-color="#6b8fa8" />
    </linearGradient>
    
    <linearGradient id="leftpanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1f0e" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#2a1f0e" stop-opacity="0.0" />
    </linearGradient>
    
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a6a50" stroke-width="0.4" stroke-opacity="0.25" />
    </pattern>
    
