  <text x="108" y="492" font-family="Georgia, serif" font-size="26" fill="#c4a84a" letter-spacing="4">1942 – 2020</text>

  
  <text x="108" y="560" font-family="Georgia, serif" font-size="20" fill="#d4c8a8" opacity="0.85">Chairman, Samsung Group</text>

  
  <text x="108" y="610" font-family="Georgia, serif" font-size="15" fill="#a89e82" line-height="1.6">Transformed Samsung from a domestic</text>
  <text x="108" y="632" font-family="Georgia, serif" font-size="15" fill="#a89e82">Korean enterprise into one of the world's</text>
  <text x="108" y="654" font-family="Georgia, serif" font-size="15" fill="#a89e82">largest electronics manufacturers.</text>

  <text x="108" y="700" font-family="Georgia, serif" font-size="15" fill="#a89e82">Architect of South Korea's position</text>
  <text x="108" y="722" font-family="Georgia, serif" font-size="15" fill="#a89e82">as a global technology leader in</text>
  <text x="108" y="744" font-family="Georgia, serif" font-size="15" fill="#a89e82">semiconductors, displays &amp; electronics.</text>

  
