<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Korean Traditional Visual Arts — Calligraphy, Painting, Sculpture, and Pottery</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="celadon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fada0" />
      <stop offset="100%" stop-color="#6b8c7e" />
    </linearGradient>
    <linearGradient id="vase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d2c4" />
      <stop offset="100%" stop-color="#b8b0a0" />
    </linearGradient>
    <linearGradient id="inkwash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a5a6a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2a2a3a" stop-opacity="0.35" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <pattern id="hatching" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a09070" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7a6a50" stroke-width="0.4" stroke-opacity="0.25" />
      <line x1="0" y1="0" x2="10" y2="0" stroke="#7a6a50" stroke-width="0.4" stroke-opacity="0.25" />
    </pattern>
  </defs>

  
