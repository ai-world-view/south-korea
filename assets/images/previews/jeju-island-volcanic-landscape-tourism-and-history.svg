    </pattern>
    <pattern id="seaLines" patternUnits="userSpaceOnUse" width="20" height="8">
      <line x1="0" y1="4" x2="20" y2="4" stroke="#4e7a8e" stroke-width="0.7" opacity="0.25" />
    </pattern>
  </defs>

  
