<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Hallyu (Korean Wave) – Global spread of South Korean popular culture</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#c9b98a" />
    </radialGradient>
    <radialGradient id="wave1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563a8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2563a8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wave2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563a8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2563a8" stop-opacity="0" />
    </radialGradient>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grey" />
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    <linearGradient id="titleBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a6b" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1a3a6b" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0392b" />
      <stop offset="60%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0" />
    </linearGradient>
  </defs>

  
