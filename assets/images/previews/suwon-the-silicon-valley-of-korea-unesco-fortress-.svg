  <title>Suwon — the Silicon Valley of Korea, UNESCO fortress city, and provincial capital</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfc8" />
      <stop offset="100%" stop-color="#d4c9a8" />
    </linearGradient>
    <linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d8e8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#e8dfc8" stop-opacity="0" />
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b8a87a" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
    <filter id="aged">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
  </defs>

  
