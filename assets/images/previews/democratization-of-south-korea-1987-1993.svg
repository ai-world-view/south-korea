  <text x="90" y="550" font-family="Georgia, serif" font-size="17" fill="#d9c9a8" opacity="0.9">▸  End of Military Authoritarian Rule</text>
  <text x="90" y="580" font-family="Georgia, serif" font-size="17" fill="#d9c9a8" opacity="0.9">▸  Civilian Government of Kim Young-sam</text>

  
